<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG 맞춤형 대출 상환 계산기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mg: {
                            blue: '#004ea1',    /* 새마을금고 메인 블루 */
                            green: '#00a651',   /* 새마을금고 메인 그린 */
                            light: '#f0f5fa',
                            dark: '#00336a',
                            border: '#e2e8f0'
                        }
                    },
                    fontFamily: {
                        sans: ['Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- 폰트 및 아이콘 설정 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet" />
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        
        /* 숫자 입력 화살표 숨기기 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* 커스텀 스크롤바 (테이블용) */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 라디오 버튼 커스텀 스타일 */
        .radio-label input:checked + div {
            background-color: #004ea1;
            color: white;
            border-color: #004ea1;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex items-center gap-3">
            <div class="w-10 h-10 bg-mg-blue rounded-lg flex items-center justify-center shadow-md">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-slate-900">MG 대출 상환 계산기</h1>
                <p class="text-sm text-slate-500">고객 맞춤형 상환 플랜을 확인해보세요.</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- 왼쪽: 입력 폼 -->
            <div class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-lg font-semibold mb-6 flex items-center gap-2">
                    <svg class="w-5 h-5 text-mg-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    대출 조건 입력
                </h2>

                <form id="calculatorForm" class="space-y-6">
                    
                    <!-- 대출 금액 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">대출 금액 (만원)</label>
                        <div class="relative">
                            <input type="text" id="loanAmount" placeholder="0" class="w-full pl-4 pr-12 py-3 bg-slate-50 border border-slate-300 rounded-xl text-right font-semibold text-lg focus:outline-none focus:ring-2 focus:ring-mg-blue focus:border-transparent transition-all" value="1000">
                            <span class="absolute right-4 top-3.5 text-slate-500 font-medium">만원</span>
                        </div>
                        <div class="text-right mt-1 text-sm font-medium text-mg-blue" id="amountKrwDisplay">1,000,000 원</div>
                        
                        <!-- 원터치 버튼 -->
                        <div class="grid grid-cols-4 gap-2 mt-3">
                            <button type="button" onclick="addAmount(100)" class="py-1.5 px-2 bg-mg-light text-mg-blue text-sm font-medium rounded-lg hover:bg-blue-100 transition-colors whitespace-nowrap">+100만</button>
                            <button type="button" onclick="addAmount(500)" class="py-1.5 px-2 bg-mg-light text-mg-blue text-sm font-medium rounded-lg hover:bg-blue-100 transition-colors whitespace-nowrap">+500만</button>
                            <button type="button" onclick="addAmount(1000)" class="py-1.5 px-2 bg-mg-light text-mg-blue text-sm font-medium rounded-lg hover:bg-blue-100 transition-colors whitespace-nowrap">+1000만</button>
                            <button type="button" onclick="resetAmount()" class="py-1.5 px-2 bg-slate-100 text-slate-600 text-sm font-medium rounded-lg hover:bg-slate-200 transition-colors whitespace-nowrap">초기화</button>
                        </div>
                    </div>

                    <!-- 대출 기간 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">대출 기간</label>
                        <div class="flex gap-2 w-full">
                            <input type="number" id="loanTerm" placeholder="0" class="flex-1 w-0 px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-right font-semibold focus:outline-none focus:ring-2 focus:ring-mg-blue transition-all" value="12">
                            <select id="termUnit" class="w-24 shrink-0 px-3 py-3 bg-slate-50 border border-slate-300 rounded-xl font-medium focus:outline-none focus:ring-2 focus:ring-mg-blue transition-all cursor-pointer">
                                <option value="months">개월</option>
                                <option value="years">년</option>
                            </select>
                        </div>
                    </div>

                    <!-- 연 이자율 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">연 이자율 (%)</label>
                        <div class="relative">
                            <input type="number" id="interestRate" step="0.01" placeholder="0.00" class="w-full pl-4 pr-10 py-3 bg-slate-50 border border-slate-300 rounded-xl text-right font-semibold focus:outline-none focus:ring-2 focus:ring-mg-blue transition-all" value="5.5">
                            <span class="absolute right-4 top-3.5 text-slate-500 font-medium">%</span>
                        </div>
                    </div>

                    <!-- 상환 방식 -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">상환 방식</label>
                        <div class="grid grid-cols-1 gap-2">
                            <label class="radio-label cursor-pointer">
                                <input type="radio" name="repaymentType" value="equal_principal_interest" class="hidden" checked>
                                <div class="px-4 py-3 border border-slate-300 rounded-xl text-center font-medium text-slate-600 transition-all hover:bg-slate-50">
                                    원리금균등분할상환
                                </div>
                            </label>
                            <label class="radio-label cursor-pointer">
                                <input type="radio" name="repaymentType" value="equal_principal" class="hidden">
                                <div class="px-4 py-3 border border-slate-300 rounded-xl text-center font-medium text-slate-600 transition-all hover:bg-slate-50">
                                    원금균등분할상환
                                </div>
                            </label>
                            <label class="radio-label cursor-pointer">
                                <input type="radio" name="repaymentType" value="bullet" class="hidden">
                                <div class="px-4 py-3 border border-slate-300 rounded-xl text-center font-medium text-slate-600 transition-all hover:bg-slate-50">
                                    만기일시상환
                                </div>
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <!-- 오른쪽: 결과 영역 -->
            <div class="lg:col-span-8 flex flex-col gap-6">
                
                <!-- 요약 카드 영역 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- 1회차 월 상환액 -->
                    <div class="bg-mg-blue text-white rounded-2xl shadow-md p-6 relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-white opacity-10 rounded-full blur-xl"></div>
                        <p class="text-blue-100 text-sm font-medium mb-1">1회차 월 상환액</p>
                        <h3 class="text-2xl md:text-3xl font-bold tracking-tight" id="firstMonthPayment">0<span class="text-lg font-normal ml-1">원</span></h3>
                        <p class="text-xs text-blue-200 mt-2" id="firstMonthDesc">원금 + 이자</p>
                    </div>

                    <!-- 총 이자액 -->
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
                        <div class="flex justify-between items-start mb-1">
                            <p class="text-slate-500 text-sm font-medium">총 이자액</p>
                            <div class="p-1.5 bg-rose-50 text-rose-500 rounded-lg">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800" id="totalInterest">0<span class="text-sm font-normal text-slate-600 ml-1">원</span></h3>
                    </div>

                    <!-- 총 상환 금액 -->
                    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6">
                        <div class="flex justify-between items-start mb-1">
                            <p class="text-slate-500 text-sm font-medium">총 상환 금액 (원금+이자)</p>
                            <div class="p-1.5 bg-mg-light text-mg-blue rounded-lg">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold text-slate-800" id="totalRepayment">0<span class="text-sm font-normal text-slate-600 ml-1">원</span></h3>
                    </div>
                </div>

                <!-- 스케줄 테이블 -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden">
                    <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="font-semibold text-slate-800">월별 상환 스케줄</h3>
                        <span class="text-xs text-slate-500 font-medium px-2 py-1 bg-slate-200 rounded-md">단위: 원</span>
                    </div>
                    
                    <div class="flex-1 overflow-x-auto custom-scrollbar">
                        <table class="w-full text-sm text-left">
                            <thead class="text-xs text-slate-500 uppercase bg-slate-50 sticky top-0 shadow-sm">
                                <tr>
                                    <th scope="col" class="px-6 py-4 font-semibold text-center w-16">회차</th>
                                    <th scope="col" class="px-6 py-4 font-semibold text-right">월 납입 원금</th>
                                    <th scope="col" class="px-6 py-4 font-semibold text-right">대출 이자</th>
                                    <th scope="col" class="px-6 py-4 font-semibold text-right text-mg-blue">월 상환금 (원금+이자)</th>
                                    <th scope="col" class="px-6 py-4 font-semibold text-right">대출 잔액</th>
                                </tr>
                            </thead>
                            <tbody id="scheduleTableBody" class="divide-y divide-slate-100 text-slate-700">
                                <!-- JS로 데이터 삽입 -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 로직 스크립트 -->
    <script>
        // DOM 요소
        const inputAmount = document.getElementById('loanAmount');
        const displayKrw = document.getElementById('amountKrwDisplay');
        const inputTerm = document.getElementById('loanTerm');
        const inputTermUnit = document.getElementById('termUnit');
        const inputRate = document.getElementById('interestRate');
        const radioTypes = document.querySelectorAll('input[name="repaymentType"]');
        
        const elFirstPayment = document.getElementById('firstMonthPayment');
        const elTotalInterest = document.getElementById('totalInterest');
        const elTotalRepayment = document.getElementById('totalRepayment');
        const tbodySchedule = document.getElementById('scheduleTableBody');

        // 숫자 포맷 (콤마)
        const formatNumber = (num) => {
            return Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        };

        // 금액 입력 필드 콤마 처리 및 한글 변환
        inputAmount.addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9]/g, '');
            if(value) {
                e.target.value = formatNumber(value);
                const krwValue = parseInt(value) * 10000;
                displayKrw.textContent = formatNumber(krwValue) + " 원";
            } else {
                e.target.value = '';
                displayKrw.textContent = "0 원";
            }
            calculateLoan();
        });

        // 원터치 버튼 로직 (+만원 단위)
        window.addAmount = function(val) {
            let currentVal = parseInt(inputAmount.value.replace(/,/g, '')) || 0;
            currentVal += val;
            inputAmount.value = formatNumber(currentVal);
            displayKrw.textContent = formatNumber(currentVal * 10000) + " 원";
            calculateLoan();
        };

        window.resetAmount = function() {
            inputAmount.value = '';
            displayKrw.textContent = "0 원";
            calculateLoan();
        };

        // 이벤트 리스너 등록 (입력 변경 시 즉시 계산)
        const inputs = [inputTerm, inputTermUnit, inputRate];
        inputs.forEach(input => input.addEventListener('input', calculateLoan));
        radioTypes.forEach(radio => radio.addEventListener('change', calculateLoan));

        // 메인 계산 로직
        function calculateLoan() {
            // 입력값 파싱
            const amountManwonStr = inputAmount.value.replace(/,/g, '');
            const pManwon = parseInt(amountManwonStr) || 0;
            const principal = pManwon * 10000; // 실제 원금 (원 단위)
            
            const termVal = parseInt(inputTerm.value) || 0;
            const termUnit = inputTermUnit.value;
            const months = termUnit === 'years' ? termVal * 12 : termVal; // 총 개월 수
            
            const annualRate = parseFloat(inputRate.value) || 0;
            const monthlyRate = annualRate / 100 / 12; // 월 이자율
            
            const type = document.querySelector('input[name="repaymentType"]:checked').value;

            // 결과 초기화
            tbodySchedule.innerHTML = '';
            
            if (principal === 0 || months === 0) {
                elFirstPayment.innerHTML = `0<span class="text-lg font-normal ml-1">원</span>`;
                elTotalInterest.innerHTML = `0<span class="text-sm font-normal text-slate-600 ml-1">원</span>`;
                elTotalRepayment.innerHTML = `0<span class="text-sm font-normal text-slate-600 ml-1">원</span>`;
                return;
            }

            let schedule = [];
            let totalInterest = 0;
            let balance = principal;

            if (type === 'equal_principal_interest') {
                // 원리금균등분할상환
                let monthlyPayment = 0;
                if (annualRate === 0) {
                    monthlyPayment = principal / months;
                } else {
                    monthlyPayment = principal * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
                }

                for (let i = 1; i <= months; i++) {
                    let interest = balance * monthlyRate;
                    let principalPayment = monthlyPayment - interest;
                    
                    // 마지막 달 단수 차이 조정
                    if (i === months) {
                        principalPayment = balance;
                        monthlyPayment = principalPayment + interest;
                        balance = 0;
                    } else {
                        balance -= principalPayment;
                    }

                    totalInterest += interest;
                    schedule.push({ month: i, principal: principalPayment, interest: interest, payment: monthlyPayment, balance: balance });
                }

            } else if (type === 'equal_principal') {
                // 원금균등분할상환
                const principalPayment = principal / months;
                
                for (let i = 1; i <= months; i++) {
                    let interest = balance * monthlyRate;
                    let monthlyPayment = principalPayment + interest;
                    
                    if (i === months) {
                        balance = 0;
                    } else {
                        balance -= principalPayment;
                    }

                    totalInterest += interest;
                    schedule.push({ month: i, principal: principalPayment, interest: interest, payment: monthlyPayment, balance: balance });
                }

            } else if (type === 'bullet') {
                // 만기일시상환
                for (let i = 1; i <= months; i++) {
                    let interest = principal * monthlyRate;
                    let principalPayment = 0;
                    let monthlyPayment = interest;

                    if (i === months) {
                        principalPayment = principal;
                        monthlyPayment = principal + interest;
                        balance = 0;
                    }

                    totalInterest += interest;
                    schedule.push({ month: i, principal: principalPayment, interest: interest, payment: monthlyPayment, balance: balance });
                }
            }

            // UI 렌더링
            renderResults(schedule, totalInterest, principal);
        }

        function renderResults(schedule, totalInterest, principal) {
            // 요약 카드 업데이트
            if (schedule.length > 0) {
                elFirstPayment.innerHTML = `${formatNumber(schedule[0].payment)}<span class="text-lg font-normal ml-1">원</span>`;
            }
            elTotalInterest.innerHTML = `${formatNumber(totalInterest)}<span class="text-sm font-normal text-slate-600 ml-1">원</span>`;
            elTotalRepayment.innerHTML = `${formatNumber(principal + totalInterest)}<span class="text-sm font-normal text-slate-600 ml-1">원</span>`;

            // 테이블 렌더링 (가상 DOM 프래그먼트 사용으로 성능 최적화)
            const fragment = document.createDocumentFragment();
            
            schedule.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="px-6 py-3 text-center text-slate-500 font-medium border-r border-slate-50">${row.month}</td>
                    <td class="px-6 py-3 text-right">${formatNumber(row.principal)}</td>
                    <td class="px-6 py-3 text-right text-slate-500">${formatNumber(row.interest)}</td>
                    <td class="px-6 py-3 text-right font-semibold text-mg-dark">${formatNumber(row.payment)}</td>
                    <td class="px-6 py-3 text-right text-slate-500">${formatNumber(row.balance)}</td>
                `;
                fragment.appendChild(tr);
            });
            
            tbodySchedule.appendChild(fragment);
        }

        // 초기 계산 실행
        calculateLoan();

    </script>
</body>
</html>
